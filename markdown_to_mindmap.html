<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown → Mindmap & Slide Studio</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & THEME SYSTEM (100% OFFLINE CSS VARIABLES)
       ========================================================================== */
    :root {
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;

      --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 260ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Dark Mode (Default) */
    [data-theme="dark"] {
      --bg-app: #0b0f19;
      --bg-surface: #111827;
      --bg-surface-2: #1a2234;
      --bg-surface-3: #243049;
      --bg-canvas: #0d1322;
      --canvas-grid: rgba(148, 163, 184, 0.08);
      --border-color: #263147;
      --border-strong: #374666;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-primary-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.16);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.55);
      --node-bg: #162035;
      --node-text: #f8fafc;
      --node-code-bg: #0f172a;
      --node-code-text: #38bdf8;
      --slide-bg: linear-gradient(145deg, #131c31 0%, #0d1323 100%);
      --slide-card-bg: rgba(30, 41, 59, 0.65);
    }

    /* Light Mode */
    [data-theme="light"] {
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-2: #f8fafc;
      --bg-surface-3: #e2e8f0;
      --bg-canvas: #f8fafc;
      --canvas-grid: rgba(15, 23, 42, 0.07);
      --border-color: #cbd5e1;
      --border-strong: #94a3b8;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-primary: #4f46e5;
      --accent-primary-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.1);
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 14px 34px rgba(15, 23, 42, 0.12);
      --node-bg: #ffffff;
      --node-text: #0f172a;
      --node-code-bg: #f1f5f9;
      --node-code-text: #0284c7;
      --slide-bg: linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%);
      --slide-card-bg: rgba(241, 245, 249, 0.85);
    }

    /* Pastel Soft Mode */
    [data-theme="pastel"] {
      --bg-app: #fdf6f0;
      --bg-surface: #fffbf7;
      --bg-surface-2: #f7efe8;
      --bg-surface-3: #ede0d4;
      --bg-canvas: #fcf7f2;
      --canvas-grid: rgba(120, 94, 78, 0.08);
      --border-color: #e3d3c4;
      --border-strong: #cbb49e;
      --text-primary: #3b2f2f;
      --text-secondary: #6d5959;
      --text-muted: #937d7d;
      --accent-primary: #d97757;
      --accent-primary-hover: #c46243;
      --accent-soft: rgba(217, 119, 87, 0.14);
      --success: #2a9d8f;
      --warning: #e9c46a;
      --danger: #e76f51;
      --shadow-sm: 0 2px 8px rgba(88, 63, 49, 0.06);
      --shadow-lg: 0 14px 34px rgba(88, 63, 49, 0.12);
      --node-bg: #ffffff;
      --node-text: #3b2f2f;
      --node-code-bg: #f7efe8;
      --node-code-text: #b55336;
      --slide-bg: linear-gradient(145deg, #fffdf9 0%, #f7ede2 100%);
      --slide-card-bg: rgba(247, 237, 226, 0.75);
    }

    /* ==========================================================================
       2. RESET & BASE LAYOUT
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    button, select, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    /* ==========================================================================
       3. TOP NAVIGATION BAR
       ========================================================================== */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 56px;
      padding: 6px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      z-index: 30;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      flex-shrink: 0;
    }

    .mode-tabs {
      display: flex;
      align-items: center;
      background: var(--bg-surface-2);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      gap: 4px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      padding: 6px 13px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .mode-tab:hover {
      color: var(--text-primary);
    }

    .mode-tab.active {
      background: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-select {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: border-color var(--transition-fast);
      max-width: 225px;
    }

    .control-select:hover, .control-select:focus {
      border-color: var(--accent-primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-2);
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
      user-select: none;
    }

    .btn:hover {
      background: var(--bg-surface-3);
      border-color: var(--border-strong);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .btn-success:hover {
      filter: brightness(1.08);
    }

    .btn-danger-outline {
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .btn-danger-outline:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: var(--danger);
    }

    .btn-icon {
      padding: 6px 8px;
    }

    .save-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-surface-2);
    }

    .save-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
    }

    /* ==========================================================================
       4. SPLIT-PANE WORKSPACE
       ========================================================================== */
    .workspace {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* Left Pane: Markdown Editor */
    .editor-pane {
      width: 37%;
      min-width: 260px;
      max-width: 75%;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-color);
      position: relative;
      z-index: 10;
    }

    .editor-pane.collapsed {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden;
      border-right: none;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 10px;
      background: var(--bg-surface-2);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .fmt-btn {
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 600;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .fmt-btn:hover {
      border-color: var(--accent-primary);
      background: var(--accent-soft);
      color: var(--accent-primary);
    }

    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      min-height: 0;
    }

    #md-editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      resize: none;
      padding: 16px 18px;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.65;
      tab-size: 2;
      overflow-y: auto;
    }

    .editor-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-surface-2);
      border-top: 1px solid var(--border-color);
      font-size: 11.5px;
      color: var(--text-secondary);
      gap: 8px;
    }

    /* Draggable Vertical Resizer */
    .resizer {
      width: 6px;
      background: transparent;
      cursor: col-resize;
      position: relative;
      z-index: 20;
      flex-shrink: 0;
      margin-left: -3px;
      margin-right: -3px;
      transition: background var(--transition-fast);
    }

    .resizer:hover, .resizer.dragging {
      background: var(--accent-primary);
    }

    /* Right Pane: Output Area */
    .output-pane {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-canvas);
      overflow: hidden;
    }

    .view-panel {
      display: none;
      flex: 1;
      min-height: 0;
      width: 100%;
      flex-direction: column;
      position: relative;
    }

    .view-panel.active {
      display: flex;
    }

    /* ==========================================================================
       5. VIEW 1: INTERACTIVE MINDMAP STUDIO
       ========================================================================== */
    .mindmap-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      z-index: 15;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .zoom-pill {
      display: inline-flex;
      align-items: center;
      background: var(--bg-surface-2);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .zoom-pill button {
      border: none;
      background: transparent;
      padding: 5px 9px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-primary);
    }

    .zoom-pill button:hover {
      background: var(--bg-surface-3);
    }

    .zoom-pill span {
      padding: 0 6px;
      font-size: 12px;
      font-weight: 600;
      min-width: 46px;
      text-align: center;
      cursor: pointer;
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--bg-surface-2);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }

    .toggle-chip.active {
      background: var(--accent-soft);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      font-weight: 600;
    }

    .mindmap-canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--canvas-grid) 1.25px, transparent 1.25px);
      background-size: 22px 22px;
      touch-action: none;
    }

    #mindmap-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      user-select: none;
    }

    #mindmap-svg.panning {
      cursor: grabbing;
    }

    .mm-node-group {
      cursor: grab;
    }

    .mm-node-group:active {
      cursor: grabbing;
    }

    .mm-node-rect {
      transition: filter 120ms ease;
    }

    .mm-node-group:hover .mm-node-rect {
      filter: brightness(1.06);
    }

    .mm-collapse-btn {
      cursor: pointer;
    }

    .mm-collapse-btn:hover circle {
      transform: scale(1.12);
    }

    /* Inline Node Quick-Edit Input */
    #node-inline-editor {
      position: absolute;
      display: none;
      z-index: 40;
      border: 2px solid var(--accent-primary);
      border-radius: 8px;
      background: var(--bg-surface);
      color: var(--text-primary);
      padding: 6px 10px;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      outline: none;
      min-width: 180px;
    }

    .canvas-hint {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      color: var(--text-secondary);
      box-shadow: var(--shadow-sm);
      pointer-events: none;
      opacity: 0.92;
      max-width: calc(100% - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       6. VIEW 2: SLIDE DECK CONVERTER & ACTIVE RECALL
       ========================================================================== */
    .slides-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
    }

    .slide-stage-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      background: var(--bg-canvas);
    }

    .slide-frame {
      width: 100%;
      max-width: 980px;
      aspect-ratio: 16 / 9;
      max-height: 100%;
      background: var(--slide-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: clamp(20px, 4vw, 48px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition-smooth), opacity var(--transition-fast);
    }

    .slide-frame::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #6366f1, #ec4899, #10b981);
    }

    /* Title Slide Variant */
    .slide-frame.is-title-slide {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .slide-kicker {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-primary);
      font-size: clamp(11px, 1.2vw, 13px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .slide-hero-title {
      font-size: clamp(24px, 3.6vw, 46px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      max-width: 85%;
      margin-bottom: 16px;
    }

    .slide-subtitle-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 78%;
      font-size: clamp(14px, 1.6vw, 20px);
      color: var(--text-secondary);
    }

    /* Content Slide Variant */
    .slide-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .slide-heading {
      font-size: clamp(19px, 2.4vw, 30px);
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }

    .slide-body {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
      align-items: stretch;
    }

    .slide-card {
      background: var(--slide-card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide-card-title {
      font-size: clamp(14px, 1.45vw, 18px);
      font-weight: 700;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .slide-bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(7px, 1.1vh, 12px);
    }

    .slide-bullet-item {
      font-size: clamp(13.5px, 1.45vw, 18.5px);
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: all var(--transition-fast);
    }

    .slide-bullet-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-primary);
      margin-top: 0.48em;
      flex-shrink: 0;
    }

    .slide-bullet-item.depth-1 {
      margin-left: 22px;
      font-size: 0.92em;
      color: var(--text-secondary);
    }

    .slide-bullet-item.depth-1 .slide-bullet-dot {
      background: transparent;
      border: 2px solid var(--accent-primary);
    }

    .slide-bullet-item.depth-2 {
      margin-left: 44px;
      font-size: 0.88em;
      color: var(--text-secondary);
    }

    /* Active Recall Masked State */
    .recall-masked {
      background: var(--bg-surface-3) !important;
      color: transparent !important;
      border: 1px dashed var(--accent-primary);
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .recall-masked * {
      opacity: 0 !important;
    }

    .recall-masked::after {
      content: "👁️ Nhấn Space / ↓ hoặc click để nhớ lại ý này";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 0 12px;
      color: var(--accent-primary);
      font-size: 12.5px;
      font-weight: 600;
      opacity: 1 !important;
    }

    .slide-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }

    /* Inline Markdown Formatting inside Slides */
    .md-bold {
      font-weight: 700;
      color: var(--text-primary);
    }
    .md-italic {
      font-style: italic;
    }
    .md-code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--node-code-bg);
      color: var(--node-code-text);
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
    }

    /* Slide Navigation Bar */
    .slide-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: var(--bg-surface);

      height: 6px;
      background: var(--bg-surface-3);
      border-radius: 999px;
      overflow: hidden;
    }

    .slide-progress-fill {
      height: 100%;
      background: var(--accent-primary);
      transition: width var(--transition-smooth);
    }

    /* Thumbnail Strip */
    .slide-thumbnails {
      display: none;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-surface-2);
      border-top: 1px solid var(--border-color);
      overflow-x: auto;
    }

    .slide-thumbnails.open {
      display: flex;
    }

    .thumb-item {
      flex: 0 0 148px;
      height: 84px;
      border-radius: var(--radius-sm);
      border: 2px solid var(--border-color);
      background: var(--bg-surface);
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all var(--transition-fast);
      overflow: hidden;
    }

    .thumb-item:hover {
      border-color: var(--border-strong);
    }

    .thumb-item.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .thumb-num {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-primary);
    }

    .thumb-title {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Fullscreen Slide Mode */
    .view-panel:fullscreen {
      background: var(--bg-app);
    }

      max-height: 84vh;

    #toast-container {

      bottom: 18px;

      display: flex;
      flex-direction: column;

      color: var(--text-primary);
