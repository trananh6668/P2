<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeMaster | Tiếng Việt</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc;
            overflow-x: hidden;
        }
        .mono { font-family: 'Fira Code', monospace; }

        /* Ẩn thanh cuộn mặc định cho khu vực văn bản */
        #text-display::-webkit-scrollbar { display: none; }
        #text-display {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            scroll-behavior: smooth;
        }
        
        /* Bàn phím phẳng 2D: KHÔNG shadow, KHÔNG translateY */
        .key-base {
            transition: background-color 0.05s ease;
        }
        .key-active {
            background-color: #3b82f6 !important; /* blue-500 */
            color: white !important;
        }
        
        /* Con trỏ absolute không chiếm diện tích (width) của chuỗi */
        .cursor-active {
            position: relative;
        }
        .cursor-active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 2.5px;
            background-color: #3b82f6;
            animation: blink 1s infinite;
            border-radius: 1px;
            z-index: 10;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

  "Hãy để lòng biết ơn dẫn lối cho mọi suy nghĩ và hành động của bạn trong từng khoảnh khắc.",
  "Cuộc hành trình đẹp nhất là hành trình quay về tìm lại chính bản thân mình nguyên vẹn nhất.",

  "Tình người nồng ấm là chiếc chăn êm ái nhất xua tan đi cái lạnh lẽo giá buốt của mùa đông.",
  "Hãy luôn ngẩng cao đầu bước về phía trước, bởi ánh sáng mặt trời luôn ở phía trước con đường bạn đi.",
  "Mỗi nỗ lực nhỏ bé của ngày hôm nay đều góp phần tạo nên những điều phi thường của ngày mai.",
  "Hạnh phúc trọn vẹn nhất là khi bạn biết cho đi mà không hề mong cầu nhận lại bất cứ điều gì.",
  "Hãy mỉm cười với cuộc đời, rồi cuộc đời sẽ mỉm cười rạng rỡ lại với bạn bằng cả tấm lòng.",
  "Chúc bạn luôn giữ vững niềm tin, nghị lực và gặt hái được thật nhiều thành công trên con đường phía trước."
        ];

        // --- TRẠNG THÁI (STATE) ---
        let currentMode = 'random'; // 'random' or 'custom'
        let targetText = "";
        let isPracticing = false;
        
        let startTime = 0;
        let timerInterval = null;
        
        let backspaceCount = 0;

        // DOM Elements
        const screens = {
            setup: document.getElementById('screen-setup'),
            typing: document.getElementById('screen-typing'),
            stats: document.getElementById('screen-stats')
        };
        
        const ui = {
            btnRandom: document.getElementById('btn-mode-random'),
            btnCustom: document.getElementById('btn-mode-custom'),
            setupTextarea: document.getElementById('setup-textarea'),
            btnStart: document.getElementById('btn-start'),
            btnEndEarly: document.getElementById('btn-end-early'),
            btnRestart: document.getElementById('btn-restart'),
            
            hiddenInput: document.getElementById('hidden-input'),
            textDisplay: document.getElementById('text-display'),
            focusOverlay: document.getElementById('focus-overlay'),
            typingContainer: document.getElementById('typing-container'),
            
            liveTime: document.getElementById('live-time'),
            liveChars: document.getElementById('live-chars'),
            
            resWpm: document.getElementById('res-wpm'),
            resChars: document.getElementById('res-chars'),
            resErrors: document.getElementById('res-errors'),
            resErrRate: document.getElementById('res-err-rate'),
            resBackspace: document.getElementById('res-backspace')
        };

        // Render Bàn phím Ảo (2D phẳng)
        function initKeyboard() {
            const container = document.getElementById('keyboard-container');
            keyboardLayout.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'flex w-full gap-2';
                row.forEach(key => {
                    const keyEl = document.createElement('div');
                    keyEl.id = 'key-' + key.code;
                    // Lớp CSS 2D phẳng, bỏ shadow và border bottom
                    keyEl.className = 'h-11 bg-slate-700 rounded flex items-center justify-center text-[11px] md:text-xs font-semibold text-slate-300 uppercase key-base';
                    keyEl.innerText = key.label;
                    keyEl.style.flex = key.flex || 1;
                    rowDiv.appendChild(keyEl);
                });
                container.appendChild(rowDiv);
            });
        }
        initKeyboard();

        // Đổi Màn Hình
        function switchScreen(screenName) {
            Object.values(screens).forEach(screen => {
                screen.classList.remove('z-20');
                screen.classList.add('z-0', 'opacity-0', 'pointer-events-none');
            });
            const activeScreen = screens[screenName];
            activeScreen.classList.remove('z-0', 'opacity-0', 'pointer-events-none');
            activeScreen.classList.add('z-20');
        }

        // Xử lý Setup Mode
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'random') {
                ui.btnRandom.classList.replace('border-slate-700', 'border-blue-500');
                ui.btnRandom.classList.replace('bg-slate-800', 'bg-blue-500/10');
                ui.btnCustom.classList.replace('border-blue-500', 'border-slate-700');
                ui.btnCustom.classList.replace('bg-blue-500/10', 'bg-slate-800');
                
                ui.setupTextarea.disabled = true;
                ui.setupTextarea.classList.add('opacity-50', 'cursor-not-allowed');
                ui.setupTextarea.value = '';
            } else {
                ui.btnCustom.classList.replace('border-slate-700', 'border-blue-500');
                ui.btnCustom.classList.replace('bg-slate-800', 'bg-blue-500/10');
                ui.btnRandom.classList.replace('border-blue-500', 'border-slate-700');
                ui.btnRandom.classList.replace('bg-blue-500/10', 'bg-slate-800');
                
                ui.setupTextarea.disabled = false;
                ui.setupTextarea.classList.remove('opacity-50', 'cursor-not-allowed');
                ui.setupTextarea.placeholder = "Dán hoặc nhập đoạn văn bản bạn muốn gõ vào đây...";
                ui.setupTextarea.focus();
            }
        }
        ui.btnRandom.addEventListener('click', () => setMode('random'));
        ui.btnCustom.addEventListener('click', () => setMode('custom'));

        // Sinh văn bản ngẫu nhiên
        function generateRandomText(sentencesCount) {
            let res = [];
            for(let i=0; i<sentencesCount; i++) {
                res.push(vietnameseSentences[Math.floor(Math.random() * vietnameseSentences.length)]);
            }
            return res.join(" ");
        }

        // Định dạng thời gian
        function formatTime(ms) {
            let totalSecs = Math.floor(ms / 1000);
            let m = Math.floor(totalSecs / 60).toString().padStart(2, '0');
            let s = (totalSecs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Render chữ đang luyện tập: Đảm bảo không padding, không margin
        function renderTypingText() {
            const typed = ui.hiddenInput.value;
            let html = '';
            
            for (let i = 0; i < targetText.length; i++) {
                const targetChar = targetText[i];
                
                if (i < typed.length) {
                    const typedChar = typed[i];
                    if (typedChar === targetChar) {
                        // Gõ Đúng: Chữ xanh, nền xanh mờ, giữ nguyên ký tự gốc
                        html += `<span class="text-green-400 bg-green-500/20">${targetChar}</span>`;
                    } else {
                        // Gõ Sai: Chữ đỏ, nền đỏ mờ, giữ nguyên ký tự gốc
                        html += `<span class="text-red-400 bg-red-500/30">${targetChar}</span>`;
                    }
                } else if (i === typed.length) {
                    // Vị trí con trỏ hiện tại (dùng cursor-active với CSS absolute)
                    html += `<span class="cursor-active text-slate-400">${targetChar}</span>`;
                } else {
                    // Chữ chưa gõ
                    html += `<span class="text-slate-500">${targetChar}</span>`;
                }
            }
            
            ui.textDisplay.innerHTML = html;
            
            // Xử lý auto-scroll mượt mà
            const cursorEl = ui.textDisplay.querySelector('.cursor-active');
            if (cursorEl) {
                const scrollTarget = cursorEl.offsetTop - (ui.textDisplay.clientHeight / 2) + 20;
                ui.textDisplay.scrollTop = scrollTarget > 0 ? scrollTarget : 0;
            }
        }

        // Bắt đầu game
        ui.btnStart.addEventListener('click', () => {
            if (currentMode === 'random') {
                targetText = generateRandomText(10);
            } else {
                let customText = ui.setupTextarea.value.trim();
                if (!customText) customText = "Bạn chưa nhập gì cả, đây là đoạn văn bản mặc định để bạn gõ.";
                targetText = customText.replace(/\s+/g, ' '); 
            }
            
            ui.hiddenInput.value = '';
            backspaceCount = 0;
            isPracticing = true;
            
            switchScreen('typing');
            renderTypingText();
            
            ui.liveTime.innerText = "00:00";
            ui.liveChars.innerText = "0";
            
            clearInterval(timerInterval);
            startTime = Date.now();
            timerInterval = setInterval(() => {
                ui.liveTime.innerText = formatTime(Date.now() - startTime);
            }, 1000);
            
            setTimeout(() => ui.hiddenInput.focus(), 100);
        });

        // Xử lý sự kiện input (IME hỗ trợ)
        ui.hiddenInput.addEventListener('input', () => {
            if (!isPracticing) return;
            const typed = ui.hiddenInput.value;
            
            ui.liveChars.innerText = typed.length;
            
            // Auto-append cho chế độ Vô Tận (Random)
            if (currentMode === 'random' && typed.length > targetText.length - 100) {
                targetText += " " + generateRandomText(5);
            }
            
            renderTypingText();
            
            // Kết thúc ở chế độ tự chọn
            if (typed.length >= targetText.length && currentMode === 'custom') {
                finishGame();
            }
        });

        // Quản lý Focus
        ui.hiddenInput.addEventListener('blur', () => {
            if (isPracticing) {
                ui.focusOverlay.classList.remove('hidden');
                ui.focusOverlay.classList.add('flex');
            }
        });
        ui.focusOverlay.addEventListener('click', () => {
            ui.focusOverlay.classList.add('hidden');
            ui.focusOverlay.classList.remove('flex');
            ui.hiddenInput.focus();
        });
        ui.typingContainer.addEventListener('click', () => ui.hiddenInput.focus());


        // Nút Kết Thúc Sớm
        ui.btnEndEarly.addEventListener('click', () => {
            if(isPracticing) finishGame();
        });

        // Kết thúc & Hiển thị kết quả
        function finishGame() {
            isPracticing = false;
            clearInterval(timerInterval);
            ui.hiddenInput.blur();
            
            const typed = ui.hiddenInput.value;
            const finalLength = typed.length;
            
            // Đếm lỗi dựa trên trạng thái cuối cùng
            let finalErrors = 0;
            for(let i = 0; i < finalLength; i++) {
                if (typed[i] !== targetText[i]) {
                    finalErrors++;
                }
            }
            
            // Tính toán WPM & Tỷ lệ sai
            const elapsedMins = (Date.now() - startTime) / 60000;
            let wpm = 0;
            if (elapsedMins > 0) {
                wpm = Math.round((finalLength / 5) / elapsedMins);
            }
            
            let errRate = 0;
            if (finalLength > 0) {
                errRate = (finalErrors / finalLength) * 100;
            }

            // Đổ dữ liệu ra UI
            ui.resWpm.innerText = wpm;
            ui.resChars.innerText = finalLength;
            ui.resErrors.innerText = finalErrors;
            ui.resErrRate.innerText = errRate.toFixed(1) + '%';
            ui.resBackspace.innerText = backspaceCount;

            switchScreen('stats');
        }

        // Chơi lại
        ui.btnRestart.addEventListener('click', () => {
            switchScreen('setup');
            if(currentMode === 'custom') {
                ui.setupTextarea.focus();
            }
        });

        // Đồng bộ hiệu ứng bàn phím
        window.addEventListener('keydown', (e) => {
            if (isPracticing && e.code === 'Backspace') {
                backspaceCount++;
            }
            const keyEl = document.getElementById('key-' + e.code);
            if (keyEl) keyEl.classList.add('key-active');
        });

        window.addEventListener('keyup', (e) => {
            const keyEl = document.getElementById('key-' + e.code);
            if (keyEl) keyEl.classList.remove('key-active');
        });

    </script>
</body>
